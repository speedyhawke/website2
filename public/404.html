<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fill the Gap NL</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts Route Recovery
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        if (l.hostname.endsWith('github.io') && l.pathname.split('/').length > 2) {
          pathSegmentsToKeep = 1;
        }
        var pathSegments = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep);
        var cleanPath = pathSegments.join('/').replace(/&/g, '~and~');
        var query = (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '');
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          cleanPath + query + l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="background-color:#0b0f19;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;padding:20px;">
      <h2 style="color:#e5a93c;">Loading Fill the Gap...</h2>
      <p style="color:#94a3b8;">Redirecting to requested page...</p>
    </div>
  </body>
</html>
