<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill the Gap | Community Support in St. John's, Newfoundland & Labrador</title>
    <meta name="description" content="Fill the Gap works to identify and close gaps between people, resources, and the support they need, starting in St. John's, Newfoundland & Labrador." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8FAFC] text-stone-900 antialiased min-h-screen selection:bg-amber-400 selection:text-slate-950 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadFTGBundle && window.__loadFTGBundle()"></script>
    <script>
      window.__loadFTGBundle = function() {
        if (window.__ftgLoaded) return;
        var root = document.getElementById('root');
        if (root && root.children && root.children.length > 0) return;
        window.__ftgLoaded = true;
        console.log('[FillTheGap] Loading precompiled production bundle...');
        if (!document.querySelector('link[data-ftg-bundle]')) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/index.css';
          link.setAttribute('data-ftg-bundle', 'true');
          document.head.appendChild(link);
        }
        if (!document.querySelector('script[data-ftg-bundle]')) {
          var script = document.createElement('script');
          script.type = 'module';
          script.src = './assets/index.js';
          script.setAttribute('data-ftg-bundle', 'true');
          document.body.appendChild(script);
        }
      };

      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isLocal) {
        setTimeout(window.__loadFTGBundle, 300);
      }
    </script>
  </body>
</html>
